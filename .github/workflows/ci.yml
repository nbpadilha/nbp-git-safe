# SPDX-License-Identifier: MIT
# No secrets are used or required. Nothing is published from this workflow.
#
# Third-party actions are pinned to full commit SHAs (the tag is in the trailing comment).
name: CI

on:
  push:
    branches: [main, "ci-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    name: quick / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv (pinned, from PyPI)
        run: python -m pip install uv==0.9.21
      - name: Sync (frozen lockfile)
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check
      - name: Unit tests (fast feedback, no coverage)
        run: uv run pytest -q --no-cov tests/unit
      - name: Integration tests (fast feedback, no coverage)
        run: uv run pytest -q --no-cov tests/integration

  test:
    needs: quick
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv (pinned, from PyPI)
        run: python -m pip install uv==0.9.21
      - name: Sync (frozen lockfile)
        run: uv sync --frozen
      - name: Licence check (SPDX MIT everywhere, no copyleft headers in src/)
        run: python scripts/check_licenses.py
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format check
        run: uv run ruff format --check
      - name: Tests with coverage (crypto.py must stay at 100% branch coverage)
        run: uv run pytest -q

  package:
    name: package (wheel and sdist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv (pinned, from PyPI)
        run: python -m pip install uv==0.9.21
      - name: Build wheel and sdist
        run: uv build --out-dir dist
      - name: Check metadata and contents (nothing internal in the sdist)
        run: python scripts/check_package.py dist
      - name: Install the wheel in a clean environment and run the entry points
        run: |
          uv venv "$RUNNER_TEMP/clean"
          uv pip install --python "$RUNNER_TEMP/clean/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/python" -I -m nbp_git_safe --version
          "$RUNNER_TEMP/clean/bin/nbp-git-safe" --version
          "$RUNNER_TEMP/clean/bin/nbp-git-safe" --help
