# SPDX-License-Identifier: MIT
# No secrets are used or required. Nothing is published from this workflow.
#
# Third-party actions are pinned to full commit SHAs (the tag is in the trailing comment).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv (pinned, from PyPI)
        run: python -m pip install uv==0.9.21
      - name: Sync (frozen lockfile)
        run: uv sync --frozen
      - name: Licence check (SPDX MIT everywhere, no copyleft headers in src/)
        run: python scripts/check_licenses.py
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format check
        run: uv run ruff format --check
      - name: Tests with coverage (crypto.py must stay at 100% branch coverage)
        run: uv run pytest -q
