[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "nbp-git-safe"
version = "0.1.1"
description = "Encrypted, name-hiding vault for sensitive files inside a Git repository."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Nikolas Padilha" }]
keywords = ["git", "encryption", "vault", "secrets", "aes-siv", "privacy", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: System :: Archiving :: Backup",
]
dependencies = ["cryptography==50.0.1"]

[project.urls]
Homepage = "https://github.com/nbpadilha/nbp-git-safe"
Repository = "https://github.com/nbpadilha/nbp-git-safe"
Issues = "https://github.com/nbpadilha/nbp-git-safe/issues"
Changelog = "https://github.com/nbpadilha/nbp-git-safe/blob/main/CHANGELOG.md"
Security = "https://github.com/nbpadilha/nbp-git-safe/blob/main/SECURITY.md"

[project.scripts]
nbp-git-safe = "nbp_git_safe.cli:console"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "coverage==7.16.1",
  "ruff==0.16.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nbp_git_safe"]

[tool.hatch.build.targets.sdist]
# An explicit list: the sdist carries the code, the tests (fake data only) and the documents a
# packager needs, and nothing else (no internal plan, no upstream test suite, no CI or editor files,
# no lockfile). scripts/check_package.py checks the built file.
include = [
  "/src",
  "/tests",
  "/scripts",
  "/docs/FORMAT.md",
  "/docs/GUARD.md",
  "/docs/MULTI.md",
  "/docs/RELEASING.md",
  "/docs/TRAY.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/SECURITY.md",
  "/THIRD_PARTY.md",
  "/THREAT_MODEL.md",
  "/pyproject.toml",
]

[tool.uv]
# Absolute date: nothing published after it can be resolved (7-day cooldown
# before the date of the lock; cryptography 50.0.1 is from 2026-08-25).
exclude-newer = "2026-09-25T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage gate: crypto.py must keep 100% branch coverage (fails the run below that).
# When running a subset of tests, add --no-cov.
addopts = "-ra --strict-markers --cov --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["nbp_git_safe"]

[tool.coverage.report]
# Gate applies to the security-critical module only (more modules join in later phases).
include = ["*/nbp_git_safe/crypto.py"]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# asserts in these modules only narrow types for the checker; none guards security.
"src/nbp_git_safe/{agent,cli,vault,multi,registry,trayconfig,traylog,fleetops,traycontroller,tray_win}.py" = ["S101"]
"tests/**" = ["S101", "S603", "S607", "S105", "S106"]
